# One command runs everything:  docker compose up --build
# Then open http://localhost:5173 (app) and http://localhost:8000/docs (API docs).

x-backend: &backend
  build: ./backend
  env_file:
    - path: ./backend/.env       # your GROQ_API_KEY (optional)
      required: false
  environment:                   # these override .env so services find each other
    MONGO_URL: mongodb://mongo:27017
    REDIS_URL: redis://redis:6379/0
    BANK_API_URL: http://bank:8001
    CORS_ORIGINS: http://localhost:5173

services:
  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: [mongo-data:/data/db]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  bank:                          # mock core-banking API
    build: ./backend
    command: uvicorn bank_service.main:app --host 0.0.0.0 --port 8001
    environment:
      BANK_FAILURE_RATE: "0"     # try 0.3 to watch the retries work
    ports: ["8001:8001"]

  api:
    <<: *backend
    ports: ["8000:8000"]
    depends_on: [mongo, redis, bank]

  worker:                        # writes post-call summaries
    <<: *backend
    command: python -m app.worker
    depends_on: [mongo, redis]

  frontend:
    build: ./frontend
    ports: ["5173:80"]
    depends_on: [api]

volumes:
  mongo-data:
